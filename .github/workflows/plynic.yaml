name: plynic flavor

# The plynic app consumes ONLY what this workflow publishes: a tag
# `v<base>-plynic.<n>` builds every ABI of the plynic flavor and attaches
# plynic-<abi>.jar, manifest.json, debug-symbols-plynic.zip and the complete
# corresponding source (sources/: SOURCES.json, SHA256SUMS and one archive
# per component, see buildscripts/collect-sources.sh) to a GitHub release of
# that tag. tool/native_libs.lock.json in the app is then filled from
# manifest.json (tool/fetch_native_libs.sh --update).
#
# <base> is the upstream the engine is built on: v1.1.11 (media-kit's build
# repo) for the 0.36-era plynic.1..7, v0.41.0 (mpv) from then on. A tag whose
# <n> starts with "rc" (v0.41.0-plynic.rc1) is published as a prerelease. A
# pushed tag is never moved: when its run fails, the fix gets the next number.
#
# Third-party actions are pinned by commit (the tag they were taken from in
# the comment). The build job only reads the repository; the release job,
# which builds nothing, is the only one that can write.

on:
  push:
    tags:
      - 'v*-plynic.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build plynic flavor (4 ABIs)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Java JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # nasm: x86/x86_64 assembly of FFmpeg, dav1d and libass. cmake (uchardet)
      # and python3 (mbedtls's config.py, libplacebo's GL loader generator)
      # come with the runner image. meson is pinned (include/depinfo.sh:
      # v_meson; mpv 0.41 needs >= 1.3.0) instead of whatever pip or the image
      # has that day; TRAVIS=1 below keeps download-sdk.sh from installing
      # another one.
      - name: Build tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends autoconf automake libtool gettext autopoint zip unzip nasm ninja-build pkg-config
          . buildscripts/include/depinfo.sh
          pipx install "meson==$v_meson"
          meson --version
      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux
      - name: Bundle (plynic)
        working-directory: ./buildscripts
        env:
          PLYNIC_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          TRAVIS: 1
        run: ./bundle_plynic.sh
      - name: Keep the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plynic-flavor
          if-no-files-found: error
          retention-days: 7
          path: |
            ./buildscripts/artifacts/plynic/plynic-*.jar
            ./buildscripts/artifacts/plynic/manifest.json
            ./buildscripts/artifacts/plynic/debug-symbols-plynic.zip
            ./buildscripts/artifacts/plynic/sources/

  release:
    name: Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plynic-flavor
          path: artifacts
      - name: Files
        run: ls -laR artifacts
      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'v') && contains(github.ref_name, '-plynic.rc') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/plynic-*.jar
            artifacts/manifest.json
            artifacts/debug-symbols-plynic.zip
            artifacts/sources/*
